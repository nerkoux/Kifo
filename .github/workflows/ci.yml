name: ci

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/api/package-lock.json
            apps/runtime-worker/package-lock.json
            apps/web/package-lock.json

      - name: Install API deps
        working-directory: apps/api
        run: npm ci

      - name: Install Runtime Worker deps
        working-directory: apps/runtime-worker
        run: npm ci

      - name: Install Web deps
        working-directory: apps/web
        run: npm ci

      - name: Build API
        working-directory: apps/api
        run: npm run build

      - name: Build Runtime Worker
        working-directory: apps/runtime-worker
        run: npm run build

      - name: Build Web
        working-directory: apps/web
        run: npm run build

      - name: Validate Docker Compose
        run: docker compose config

  docker-images:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: docker build -t kifo-api:ci ./apps/api

      - name: Build Runtime Worker image
        run: docker build -t kifo-runtime-worker:ci ./apps/runtime-worker

      - name: Build Web image
        run: docker build -t kifo-web:ci ./apps/web
