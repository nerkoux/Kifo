# ==========================================
# Kifo Platform - Docker Compose (Phase 1)
# ==========================================
# Production-grade local development stack
# Includes: API, Runtime Workers, Frontend, DB, Cache, Queue, Monitoring

services:
  # ==========================================
  # PostgreSQL - Primary Database
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: kifo-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kifo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kifosecret}
      POSTGRES_DB: ${POSTGRES_DB:-kifo_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kifo} -d ${POSTGRES_DB:-kifo_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kifo-network

  # ==========================================
  # Redis - Cache, Queues, Pub/Sub
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: kifo-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kifo-network

  # ==========================================
  # MinIO - Object Storage (S3-compatible)
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: kifo-minio
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kifo-network

  # ==========================================
  # Backend API (NestJS)
  # ==========================================
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    container_name: kifo-api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      API_PORT: ${API_PORT:-4000}
    volumes:
      - ./apps/api:/app
      - /app/node_modules
      - /app/dist
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kifo-network
    command: sh -c "npx prisma db push --accept-data-loss && npm run start:dev"

  # ==========================================
  # Runtime Worker (Discord Bot Runtime)
  # ==========================================
  runtime-worker:
    build:
      context: ./apps/runtime-worker
      dockerfile: Dockerfile
      target: development
    container_name: kifo-runtime-worker
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      RUNTIME_WORKER_PORT: ${RUNTIME_WORKER_PORT:-5000}
      MAX_BOTS_PER_WORKER: ${MAX_BOTS_PER_WORKER:-50}
      WORKFLOW_CONCURRENCY: ${WORKFLOW_CONCURRENCY:-10}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      - ./apps/runtime-worker:/app
      - /app/node_modules
      - /app/dist
    ports:
      - "${RUNTIME_WORKER_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - kifo-network
    command: npm run start:dev
    deploy:
      replicas: 1

  # ==========================================
  # Frontend (Next.js)
  # ==========================================
  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: development
    container_name: kifo-frontend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:4000}
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - kifo-network
    command: npm run dev

  # ==========================================
  # NGINX - Reverse Proxy / Load Balancer
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: kifo-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - api
      - runtime-worker
    networks:
      - kifo-network

  # ==========================================
  # Prometheus - Metrics Collection
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: kifo-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - kifo-network

  # ==========================================
  # Grafana - Metrics Visualization
  # ==========================================
  grafana:
    image: grafana/grafana:latest
    container_name: kifo-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - kifo-network

  # ==========================================
  # Loki - Log Aggregation
  # ==========================================
  loki:
    image: grafana/loki:latest
    container_name: kifo-loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./infrastructure/observability/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - kifo-network

  # ==========================================
  # Promtail - Log Shipping
  # ==========================================
  promtail:
    image: grafana/promtail:latest
    container_name: kifo-promtail
    volumes:
      - /var/log:/var/log:ro
      - ./infrastructure/observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - kifo-network

volumes:
  postgres-data:
  redis-data:
  minio-data:
  prometheus-data:
  grafana-data:
  loki-data:

networks:
  kifo-network:
    driver: bridge
